name: Crestline Capital CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crestline_ci?schema=public
      JWT_ACCESS_SECRET: crestline-ci-access-secret-32-characters-min
      JWT_REFRESH_SECRET: crestline-ci-refresh-secret-32-characters-min
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Generate production migration artifact
        run: mkdir -p prisma/migrations/0001_init && npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/0001_init/migration.sql
      - name: Commit generated production migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations/0001_init/migration.sql
          if ! git diff --cached --quiet; then
            git commit -m "db: add initial production Prisma migration"
            git push origin HEAD:main
          fi
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
